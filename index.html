<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ocean Box</title>
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body>
    <main>
      <section class="hero" aria-label="Ocean Box">
        <img src="./assets/Image.png" alt="hero-background-image" class="hero-image" aria-hidden="true" />

        <header class="site-header">
          <nav class="navbar" aria-label="Main navigation">
            <a href="#" class="navbar-logo" aria-label="Ocean Box home">
              <img src="./assets/companyLogo.svg" alt="company-logo" class="logo-image" />
              <span class="logo-text"> OCEAN BOX </span>
            </a>

            <div class="navbar-links">
              <a href="#"> About the company </a>
              <a href="#"> What we offer </a>
            </div>

            <a href="#" class="contact-btn">
              <span>Contact Us</span>

              <span class="contact-arrow" aria-hidden="true">
                <img src="./assets/contact-arrow.svg" alt="contact-arrow" />
              </span>
            </a>
          </nav>
        </header>

        <div class="hero-content">
          <div class="hero-heading">
            <div> EFFICIENCY </div>

            <div>
              <span>BEYOND</span>
              <span class="heading-blue"> THE BOX </span>
            </div>
          </div>

          <div class="hero-description">
            <p> Container storage and handling you can trust </p>

            <a href="#" class="about-btn">
              <span> About Us </span>

              <span class="about-arrow" aria-hidden="true">
                <img src="./assets/about-us-arrow.svg" alt="about-us-arrow" />
              </span>
            </a>
          </div>
        </div>

        <img src="./assets/Hero-Section-Container.png" alt="hero-section-container" class="hero-container" aria-hidden="true" />
      </section>
    </main>
  </body>
</html>
